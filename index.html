<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ヒマロビー</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
.textarea{
  width: 100%;
  box-sizing: border-box;
  display: block;

  margin: 0;                 /* ←ズレ原因になりがち */
  padding: 12px 14px;

  border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;

  font-size: 16px;
  font-family: inherit;       /* ←これ重要 */
  line-height: 1.4;
  color: var(--text);

  outline: none;
  resize: none;
  min-height: 72px;
}

.textarea::placeholder{
  color: #98a2b3;
}

    
    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f8;
      margin: 0;
      padding: 16px;
    }
    .wrap { max-width: 900px; margin: auto; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    #lobby {
      position: relative;
      height: 400px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }


/* フォーム用ラベル（重ならない） */
.field-label{
  display:block;
  font-size:12px;
  color:#666;
  margin: 0 0 6px;
}

/* ロビーの名前ラベル（吹き出しの下） */
.bubble-label{
  position:absolute;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 999px;
  padding: 2px 6px;
  white-space: nowrap;
}

    
    .icon-btn {
  font-size: 20px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
}

.icon-btn.selected {
  border-color: #111;
  background: #f0f0f0;
}
.tooltip {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.96);
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 6px 8px;
  font-size: 12px;
  line-height: 1.4;
  white-space: nowrap;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  display: none;
  pointer-events: none;
}
.icon-area {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed #ddd;
}

.icon-title {
  font-size: 12px;
  color: #666;
  margin-bottom: 6px;
}

#post {
  margin-top: 12px;
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border-radius: 10px;
}

#post:disabled {
  background: #ccc;
  border-color: #ccc;
  cursor: not-allowed;
}

    :root{
  --bg:#f6f7f8;
  --card:#fff;
  --text:#111;
  --muted:#667085;
  --line:#e5e7eb;
  --shadow: 0 10px 25px rgba(0,0,0,0.06);
}

.card.form-card{
  border-radius: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  padding: 16px;
}

.form-head{ margin-bottom: 12px; }
.form-head .title{
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .2px;
}
.form-head .desc{
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

.field{ margin-top: 12px; }
.label{
  display:block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.input, .select{
  width: 100%;
  box-sizing: border-box;
  height: 48px;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 16px;          /* ←スマホで読みやすい */
  color: var(--text);
  outline: none;
}

.input::placeholder{ color: #98a2b3; }

.input:focus, .select:focus{
  border-color: #111;
  box-shadow: 0 0 0 4px rgba(17,17,17,0.08);
}

/* --- ステータス select を“選ぶUI”に見せる --- */
.select-wrap{
  position: relative;
}
.select{
  appearance: none;
  -webkit-appearance: none;
  padding-right: 40px; /* 矢印の場所 */
  font-weight: 650;
}
.chev{
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: #111;
  font-size: 14px;
  opacity: .75;
}

.hint{
  margin-top: 6px;
  font-size: 12px;
  color: var(--muted);
}

/* --- アイコンエリア --- */
.icon-area{
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}
.icon-title{
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

.icon-btn{
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.icon-btn:active{ transform: scale(0.98); }
.icon-btn.selected{
  border-color: #111;
  box-shadow: 0 10px 22px rgba(0,0,0,0.12);
}

/* --- ボタン --- */
.primary{
  margin-top: 14px;
  width: 100%;
  height: 52px;
  border-radius: 14px;
  border: 1px solid #111;
  background: #111;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
.primary:disabled{
  background: #d1d5db;
  border-color: #d1d5db;
  cursor: not-allowed;
}

.actions{ margin-top: 10px; justify-content: space-between; }
.ghost{
  height: 44px;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  color: #111;
  cursor: pointer;
}
.info{ font-size: 12px; color: var(--muted); }

    
  </style>
</head>
<body>

<div class="wrap">
<div class="card form-card">
  <div class="form-head">
    <div class="title">いまの状態を出す</div>
  </div>

  <div class="field">
    <label class="label" for="name">Spoon名</label>
    <input id="name" class="input" placeholder="例：たけもと" autocomplete="nickname" />
  </div>

  <div class="field">
    <label class="label" for="status">ステータス</label>
    <div class="select-wrap">
      <select id="status" class="select">
        <option value="ひま">🫧 ひま</option>
        <option value="作業中だけど聞ける">🧩 作業中だけど聞ける</option>
        <option value="聞き専">🎧 聞き専</option>
        <option value="配信中">🎙️ 配信中</option>
      </select>
      <span class="chev">▾</span>
    </div>
  </div>

 <div class="field">
  <label class="field-label" for="note">ひとこと（任意）</label>
  <textarea id="note" class="textarea" rows="2"
    placeholder="例：30分だけ／いま聞けるよ／作業しながらいます"></textarea>
</div>


  <div class="icon-area">
    <div class="icon-title">アイコン（必須）</div>
    <div class="row" id="iconPicker">
      <button type="button" class="icon-btn">🫧</button>
      <button type="button" class="icon-btn">🐱</button>
      <button type="button" class="icon-btn">🐶</button>
      <button type="button" class="icon-btn">🦊</button>
      <button type="button" class="icon-btn">👻</button>
    </div>
    <div class="hint" id="iconHint">先にアイコンを選ぶと「出す」が押せます。</div>
  </div>

  <button id="post" class="primary" disabled>この内容で出す</button>

  <div class="row actions">
    <span id="info" class="info"></span>
  </div>
</div>
  <div class="card">
    <div id="lobby"></div>
  </div>
</div>

<script>
/* =====================
   Supabase
===================== */
const sb = supabase.createClient(
  "https://ktoqorjcjkqmwygfsbvw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3FvcmpjamtxbXd5Z2ZzYnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NDk3OTQsImV4cCI6MjA4NDAyNTc5NH0.GRM8Yi6g2lGEvgfatHFeZhB6jPPZRlcNMfQK2d8Kc0I"
);

/* =====================
   client_id
===================== */
const KEY = "hima_client_id";
let clientId = localStorage.getItem(KEY);
if (!clientId) {
  clientId = crypto.randomUUID();
  localStorage.setItem(KEY, clientId);
}

/* =====================
   DOM
===================== */
const lobby = document.getElementById("lobby");
const elName = document.getElementById("name");
const elStatus = document.getElementById("status");
const elNote = document.getElementById("note");
const elInfo = document.getElementById("info");

/* =====================
   icon picker
===================== */
document.querySelectorAll(".icon-btn").forEach(btn => {
  btn.onclick = () => {
    selectedIcon = btn.textContent;
    document.querySelectorAll(".icon-btn")
      .forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  };
});

/* =====================
   state
===================== */
let bodies = [];

/* =====================
   fetch
===================== */
async function fetchEntries() {
  const { data, error } = await sb
    .from("lobby_entries")
    .select("*")
    .order("updated_at", { ascending: false });

  if (error) {
    console.error(error);
    return [];
  }
  return data;
}

/* =====================
   post
===================== */
async function postStatus(name, status, note) {
  const { error } = await sb
    .from("lobby_entries")
    .upsert(
      {
        client_id: clientId,
        name,
        status,
        note,
        icon: selectedIcon,
        updated_at: new Date().toISOString(),
      },
      { onConflict: "client_id" }
    );

  if (error) {
    console.error(error);
    alert(error.message);
  }
}

let selectedIcon = null;

const postBtn = document.getElementById("post");
const iconHint = document.getElementById("iconHint");
const iconButtons = document.querySelectorAll(".icon-btn");

function setSelectedIcon(btn){
  selectedIcon = btn.textContent.trim();
  iconButtons.forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");

  // ✅ ここで必ず押せるようにする
  postBtn.disabled = false;
  if (iconHint) iconHint.textContent = `選択中：${selectedIcon}`;
}

// ✅ クリックイベント付与
iconButtons.forEach(btn => {
  btn.addEventListener("click", () => setSelectedIcon(btn));
});

// ✅ ページ読み込み時に「最初のアイコン」を自動選択（押せない事故防止）
if (iconButtons.length > 0) setSelectedIcon(iconButtons[0]);

  
/* =====================
   render
===================== */
function render(entries) {
  lobby.innerHTML = "";
  bodies = [];

  const W = lobby.clientWidth;
  const H = lobby.clientHeight;

  entries.forEach(e => {
    const b = {
      ...e,
      x: Math.random() * (W - 60),
      y: Math.random() * (H - 60),
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      el: document.createElement("div")
    };

    b.el.className = "bubble";
    
    b.el.onclick = (e2) => {
      e2.stopPropagation();
    
      // いったん全部閉じる
      document.querySelectorAll(".tooltip").forEach(t => {
        t.style.display = "none";
      });
    
      // 自分のだけ開く
      tip.style.display = "block";
    };

    
// アイコン
const icon = document.createElement("div");
icon.textContent = e.icon || "🫧";
b.el.appendChild(icon);

// ツールチップ（ステータス＋ひとこと）
const tip = document.createElement("div");
tip.className = "tooltip";
tip.innerHTML = `
  <div><strong>${e.name}</strong></div>
  <div>📌 ${e.status}</div>
  <div>${e.note ? `💬 ${e.note}` : "💬（ひとことなし）"}</div>
`;
b.el.appendChild(tip);


    const label = document.createElement("div");
    label.className = "bubble-label";
    label.textContent = e.name;
    b.el.appendChild(label);

    // 自分だけ削除可能
    if (e.client_id === clientId) {
      const del = document.createElement("div");
      del.textContent = "✖";
      del.style.position = "absolute";
      del.style.top = "-6px";
      del.style.right = "-6px";
      del.style.cursor = "pointer";
      del.onclick = async () => {
        await sb.from("lobby_entries")
          .delete()
          .eq("client_id", clientId);
        refresh();
      };
      b.el.appendChild(del);
    }

    lobby.appendChild(b.el);
    bodies.push(b);
  });
}

/* =====================
   ふわふわ物理
===================== */
function loop() {
  const W = lobby.clientWidth;
  const H = lobby.clientHeight;

  bodies.forEach(b => {
    b.vx += (Math.random() - 0.5) * 0.02;
    b.vy += (Math.random() - 0.5) * 0.02;
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < 0 || b.x > W - 60) b.vx *= -1;
    if (b.y < 0 || b.y > H - 60) b.vy *= -1;

    b.el.style.transform =
      `translate(${b.x}px, ${b.y}px)`;
  });

  requestAnimationFrame(loop);
}

/* =====================
   UI
===================== */
document.getElementById("post").onclick = async () => {
  if (!elName.value.trim()) {
    alert("名前入れてね");
    return;
  }
  await postStatus(elName.value, elStatus.value, elNote.value);
  elInfo.textContent = "出しました！";
  refresh();
};

/* =====================
   init
===================== */
async function refresh() {
  const entries = await fetchEntries();
  render(entries);
}

refresh();
loop();
  document.body.addEventListener("click", () => {
  document.querySelectorAll(".tooltip").forEach(t => {
    t.style.display = "none";
  });
});

</script>

</body>
</html>
