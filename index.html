<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ヒマロビー</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f8;
      margin: 0;
      padding: 16px;
    }
    .wrap { max-width: 900px; margin: auto; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    #lobby {
      position: relative;
      height: 400px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }
    .label {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 2px 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <input id="name" placeholder="Spoon名" />
    <select id="status">
      <option>ひま</option>
      <option>作業中だけど聞ける</option>
      <option>聞き専</option>
      <option>配信中</option>
    </select>
    <input id="note" placeholder="一言（任意）" />
    <button id="post">出す</button>
    <button id="remove">自分を消す</button>
    <span id="info"></span>
  </div>

  <div class="card">
    <div id="lobby"></div>
  </div>
</div>

<script>
/* =====================
   Supabase 初期化
===================== */
const sb = supabase.createClient(
  "https://ktoqorjcjkqmwygfsbvw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3FvcmpjamtxbXd5Z2ZzYnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NDk3OTQsImV4cCI6MjA4NDAyNTc5NH0.GRM8Yi6g2lGEvgfatHFeZhB6jPPZRlcNMfQK2d8Kc0I"
);

/* =====================
   client_id（本人識別）
===================== */
const CLIENT_KEY = "hima_client_id";
let clientId = localStorage.getItem(CLIENT_KEY);
if (!clientId) {
  clientId = crypto.randomUUID();
  localStorage.setItem(CLIENT_KEY, clientId);
}

/* =====================
   DOM
===================== */
const lobbyEl = document.getElementById("lobby");
const elName = document.getElementById("name");
const elStatus = document.getElementById("status");
const elNote = document.getElementById("note");
const elInfo = document.getElementById("info");

/* =====================
   表示
===================== */
function render(entries) {
  lobbyEl.innerHTML = "";
  const W = lobbyEl.clientWidth;
  const H = lobbyEl.clientHeight;

  entries.forEach(e => {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = "🫧";
    b.style.left = Math.random() * (W - 64) + "px";
    b.style.top = Math.random() * (H - 64) + "px";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = e.name;

    b.appendChild(label);
    lobbyEl.appendChild(b);
  });
}

/* =====================
   取得
===================== */
async function fetchEntries() {
  const { data, error } = await sb
    .from("lobby_entries")
    .select("*")
    .order("updated_at", { ascending: false });

  if (error) {
    console.error(error);
    return [];
  }
  return data;
}

async function refresh() {
  const entries = await fetchEntries();
  render(entries);
}

/* =====================
   投稿
===================== */
document.getElementById("post").onclick = async () => {
  const name = elName.value.trim();
  if (!name) {
    alert("名前を入れてね");
    return;
  }

  const { error } = await sb
    .from("lobby_entries")
    .upsert({
      client_id: clientId,
      name,
      status: elStatus.value,
      note: elNote.value,
      updated_at: new Date().toISOString()
    }, { onConflict: "client_id" });

  if (error) {
    alert(error.message);
    return;
  }

  elInfo.textContent = "出しました！";
  await refresh();
};

/* =====================
   削除（自分だけ）
===================== */
document.getElementById("remove").onclick = async () => {
  const { error } = await sb
    .from("lobby_entries")
    .delete()
    .eq("client_id", clientId);

  if (error) {
    alert(error.message);
    return;
  }

  elInfo.textContent = "消しました";
  await refresh();
};

/* =====================
   初期表示
===================== */
refresh();
</script>
</body>
</html>
