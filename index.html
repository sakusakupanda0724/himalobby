<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ヒマロビー</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f8;
      margin: 0;
      padding: 16px;
    }
    .wrap { max-width: 900px; margin: auto; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    #lobby {
      position: relative;
      height: 400px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }
    .label {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 2px 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <input id="name" placeholder="Spoon名" />
    <select id="status">
      <option>ひま</option>
      <option>作業中だけど聞ける</option>
      <option>聞き専</option>
      <option>配信中</option>
    </select>
    <input id="note" placeholder="一言（任意）" />
    <button id="post">出す</button>
    <button id="remove">自分を消す</button>
    <span id="info"></span>
  </div>

  <div class="card">
    <div id="lobby"></div>
  </div>
</div>

<script>
/* =====================
   Supabase
===================== */
const sb = supabase.createClient(
  "https://ktoqorjcjkqmwygfsbvw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3FvcmpjamtxbXd5Z2ZzYnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NDk3OTQsImV4cCI6MjA4NDAyNTc5NH0.GRM8Yi6g2lGEvgfatHFeZhB6jPPZRlcNMfQK2d8Kc0I"
);

/* =====================
   client_id
===================== */
const KEY = "hima_client_id";
let clientId = localStorage.getItem(KEY);
if (!clientId) {
  clientId = crypto.randomUUID();
  localStorage.setItem(KEY, clientId);
}

/* =====================
   DOM
===================== */
const lobby = document.getElementById("lobby");
const elName = document.getElementById("name");
const elStatus = document.getElementById("status");
const elNote = document.getElementById("note");
const elInfo = document.getElementById("info");

/* =====================
   state
===================== */
let bodies = [];

/* =====================
   fetch
===================== */
async function fetchEntries() {
  const { data } = await sb
    .from("lobby_entries")
    .select("*")
    .order("updated_at", { ascending: false });
  return data ?? [];
}

/* =====================
   render
===================== */
function render(entries) {
  lobby.innerHTML = "";
  bodies = [];

  const W = lobby.clientWidth;
  const H = lobby.clientHeight;

  entries.forEach(e => {
    const b = {
      ...e,
      x: Math.random() * (W - 60),
      y: Math.random() * (H - 60),
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      el: document.createElement("div")
    };

    b.el.className = "bubble";
    b.el.textContent = "🫧";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = e.name;

    b.el.appendChild(label);

    // 自分だけ削除ボタン
    if (e.client_id === clientId) {
      const del = document.createElement("div");
      del.textContent = "✖";
      del.style.position = "absolute";
      del.style.top = "-6px";
      del.style.right = "-6px";
      del.style.cursor = "pointer";
      del.onclick = async () => {
        await sb
          .from("lobby_entries")
          .delete()
          .eq("client_id", clientId);
        refresh();
      };
      b.el.appendChild(del);
    }

    lobby.appendChild(b.el);
    bodies.push(b);
  });
}

/* =====================
   ふわふわ物理
===================== */
function loop() {
  const W = lobby.clientWidth;
  const H = lobby.clientHeight;

  bodies.forEach(b => {
    b.vx += (Math.random() - 0.5) * 0.02;
    b.vy += (Math.random() - 0.5) * 0.02;

    b.x += b.vx;
    b.y += b.vy;

    if (b.x < 0 || b.x > W - 60) b.vx *= -1;
    if (b.y < 0 || b.y > H - 60) b.vy *= -1;

    b.el.style.transform =
      `translate(${b.x}px, ${b.y}px)`;
  });

  requestAnimationFrame(loop);
}

/* =====================
   post
===================== */
document.getElementById("post").onclick = async () => {
  if (!elName.value.trim()) return alert("名前入れてね");

  await sb.from("lobby_entries").upsert(
    {
      client_id: clientId,
      name: elName.value.trim(),
      status: elStatus.value,
      note: elNote.value,
      updated_at: new Date().toISOString()
    },
    { onConflict: "client_id" }
  );

  elInfo.textContent = "出しました！";
  refresh();
};

/* =====================
   refresh
===================== */
async function refresh() {
  const entries = await fetchEntries();
  render(entries);
}

/* =====================
   init
===================== */
refresh();
loop();

</script>
</body>
</html>
