<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ヒマロビー</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f8;
      margin: 0;
      padding: 16px;
    }
    .wrap { max-width: 900px; margin: auto; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    #lobby {
      position: relative;
      height: 400px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }
    .label {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 2px 6px;
      white-space: nowrap;
    }
    .icon-btn {
  font-size: 20px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
}

.icon-btn.selected {
  border-color: #111;
  background: #f0f0f0;
}
.tooltip {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.96);
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 6px 8px;
  font-size: 12px;
  line-height: 1.4;
  white-space: nowrap;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  display: none;
  pointer-events: none;
}
.icon-area {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed #ddd;
}

.icon-title {
  font-size: 12px;
  color: #666;
  margin-bottom: 6px;
}

#post {
  margin-top: 12px;
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border-radius: 10px;
}

#post:disabled {
  background: #ccc;
  border-color: #ccc;
  cursor: not-allowed;
}

    
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <input id="name" placeholder="Spoon名" />
    <select id="status">
      <option>ひま</option>
      <option>作業中だけど聞ける</option>
      <option>聞き専</option>
      <option>配信中</option>
    </select>
    <input id="note" placeholder="一言（任意）" />
    <div class="row" id="iconPicker">
  <span>アイコン：</span>
  <button class="icon-btn">🫧</button>
  <button class="icon-btn">🐱</button>
  <button class="icon-btn">🐶</button>
  <button class="icon-btn">🦊</button>
  <button class="icon-btn">👻</button>
</div>
    
    <button id="post">出す</button>
    <button id="remove">自分を消す</button>
    <span id="info"></span>
  </div>
 

  <div class="card">
    <div id="lobby"></div>
  </div>
</div>

<script>
/* =====================
   Supabase
===================== */
const sb = supabase.createClient(
  "https://ktoqorjcjkqmwygfsbvw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3FvcmpjamtxbXd5Z2ZzYnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NDk3OTQsImV4cCI6MjA4NDAyNTc5NH0.GRM8Yi6g2lGEvgfatHFeZhB6jPPZRlcNMfQK2d8Kc0I"
);

/* =====================
   client_id
===================== */
const KEY = "hima_client_id";
let clientId = localStorage.getItem(KEY);
if (!clientId) {
  clientId = crypto.randomUUID();
  localStorage.setItem(KEY, clientId);
}

/* =====================
   DOM
===================== */
const lobby = document.getElementById("lobby");
const elName = document.getElementById("name");
const elStatus = document.getElementById("status");
const elNote = document.getElementById("note");
const elInfo = document.getElementById("info");

/* =====================
   icon picker
===================== */
let selectedIcon = "🫧";

document.querySelectorAll(".icon-btn").forEach(btn => {
  btn.onclick = () => {
    selectedIcon = btn.textContent;
    document.querySelectorAll(".icon-btn")
      .forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  };
});

/* =====================
   state
===================== */
let bodies = [];

/* =====================
   fetch
===================== */
async function fetchEntries() {
  const { data, error } = await sb
    .from("lobby_entries")
    .select("*")
    .order("updated_at", { ascending: false });

  if (error) {
    console.error(error);
    return [];
  }
  return data;
}

/* =====================
   post
===================== */
async function postStatus(name, status, note) {
  const { error } = await sb
    .from("lobby_entries")
    .upsert(
      {
        client_id: clientId,
        name,
        status,
        note,
        icon: selectedIcon,
        updated_at: new Date().toISOString(),
      },
      { onConflict: "client_id" }
    );

  if (error) {
    console.error(error);
    alert(error.message);
  }
}

document.querySelectorAll(".icon-btn").forEach(btn => {
  btn.onclick = () => {
    selectedIcon = btn.textContent;

    document.querySelectorAll(".icon-btn")
      .forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    postBtn.disabled = false; // ← ここ！
  };
});

  
/* =====================
   render
===================== */
function render(entries) {
  lobby.innerHTML = "";
  bodies = [];

  const W = lobby.clientWidth;
  const H = lobby.clientHeight;

  entries.forEach(e => {
    const b = {
      ...e,
      x: Math.random() * (W - 60),
      y: Math.random() * (H - 60),
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      el: document.createElement("div")
    };

    b.el.className = "bubble";
    
    b.el.onclick = (e2) => {
      e2.stopPropagation();
    
      // いったん全部閉じる
      document.querySelectorAll(".tooltip").forEach(t => {
        t.style.display = "none";
      });
    
      // 自分のだけ開く
      tip.style.display = "block";
    };

    
// アイコン
const icon = document.createElement("div");
icon.textContent = e.icon || "🫧";
b.el.appendChild(icon);

// ツールチップ（ステータス＋ひとこと）
const tip = document.createElement("div");
tip.className = "tooltip";
tip.innerHTML = `
  <div><strong>${e.name}</strong></div>
  <div>📌 ${e.status}</div>
  <div>${e.note ? `💬 ${e.note}` : "💬（ひとことなし）"}</div>
`;
b.el.appendChild(tip);


    const label = document.createElement("div");
    label.className = "label";
    label.textContent = e.name;
    b.el.appendChild(label);

    // 自分だけ削除可能
    if (e.client_id === clientId) {
      const del = document.createElement("div");
      del.textContent = "✖";
      del.style.position = "absolute";
      del.style.top = "-6px";
      del.style.right = "-6px";
      del.style.cursor = "pointer";
      del.onclick = async () => {
        await sb.from("lobby_entries")
          .delete()
          .eq("client_id", clientId);
        refresh();
      };
      b.el.appendChild(del);
    }

    lobby.appendChild(b.el);
    bodies.push(b);
  });
}

/* =====================
   ふわふわ物理
===================== */
function loop() {
  const W = lobby.clientWidth;
  const H = lobby.clientHeight;

  bodies.forEach(b => {
    b.vx += (Math.random() - 0.5) * 0.02;
    b.vy += (Math.random() - 0.5) * 0.02;
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < 0 || b.x > W - 60) b.vx *= -1;
    if (b.y < 0 || b.y > H - 60) b.vy *= -1;

    b.el.style.transform =
      `translate(${b.x}px, ${b.y}px)`;
  });

  requestAnimationFrame(loop);
}

/* =====================
   UI
===================== */
document.getElementById("post").onclick = async () => {
  if (!elName.value.trim()) {
    alert("名前入れてね");
    return;
  }
  await postStatus(elName.value, elStatus.value, elNote.value);
  elInfo.textContent = "出しました！";
  refresh();
};

/* =====================
   init
===================== */
async function refresh() {
  const entries = await fetchEntries();
  render(entries);
}

refresh();
loop();
  document.body.addEventListener("click", () => {
  document.querySelectorAll(".tooltip").forEach(t => {
    t.style.display = "none";
  });
});

</script>

</body>
</html>
